name: Validate and publish finance demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: finance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install verified dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Build reference pipeline and dashboard
        run: python -m src.fpi.pipeline
      - name: Build and test dbt DuckDB models
        run: |
          cp analytics/profiles.example.yml analytics/profiles.yml
          dbt build --project-dir analytics --profiles-dir analytics
      - name: Materialize Dagster assets
        run: python -m orchestration.definitions
      - name: Reconcile financial models and generated demo
        run: python -m src.fpi.verify
      - name: Check deterministic sources and demo
        run: git diff --exit-code -- data/raw analytics/seeds docs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload validated demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
